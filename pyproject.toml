[build-system]
requires = ["setuptools>=61.2", ]
build-backend = "setuptools.build_meta"

[project]
name = "pysem"
version = "1.3.1.dev0"
description = "PySem: Python library for handling semantic data in linguistics"
keywords = ["linguistics", "semantic data", "computational linguistics", "Concepticon", ]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: MIT License"]
requires-python = ">=3.9"
dependencies = []
authors = [
    { name = "Johann-Mattis List", email = "mattis.list@uni-passau.de" },
]
maintainers = [
    { name = "Johann-Mattis List", email = "mattis.list@uni-passau.de" },
    { name = "Robert Forkel", email = "robert_forkel@eva.mpg.de" },
]

readme = { file = "README.md", content-type = "text/markdown" }

[project.license]
text = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/lingpy/pysem.git"


[project.optional-dependencies]
dev = ["build", "wheel", "twine", "tox", "pyconcepticon", "pylint", ]
test = ["pytest", "pytest-cov", "coverage", ]

[tool.setuptools]
zip-safe = false
include-package-data = true
platforms = ["any", ]

[tool.flake8]
ignore = "E711,E712,D100,D101,D103,D102,D301,E731"
max-line-length = "100"
exclude = ".tox"

[tool.testenv]
deps = ".[test]"
commands = "pytest {posargs}"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
pysem = ["data/*", ]

[tool.distutils.bdist_wheel]
universal = 1

[tool.distutils.easy_install]
zip-ok = false

[tool.pytest.ini_options]
minversion = "5"
testpaths = ["tests", ]
addopts = "--cov"

[tool.coverage.run]
source = ["edictor", "tests", ]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.tox]
env_list = ["py39", "py310", "py311", "py312", "py313", "py314"]
isolated_build = "true"
skip_missing_interpreter = "true"

[tool.tox.env_run_base]
deps = [".[test]"]
commands = [["pytest", "--no-cov"]]

[tool.setuptools.packages.find]
where = ["src", ]
namespaces = false
